spring.application.name=tudentaria

# Puerto dinámico asignado por el servidor cloud (Render/Railway)
server.port=${PORT:8080}

# Configuración de base de datos MySQL con soporte para variables de entorno
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/tudentaria?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

# Límite de carga de archivos (fotos de doctores)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB